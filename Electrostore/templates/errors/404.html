{% extends 'base.html' %}
{% block title %}404 - Page Not Found | VoltCart{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="py-5">
    <div class="display-1 fw-bold text-primary mb-3"><i class="fa-solid fa-triangle-exclamation"></i> 404</div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted mx-auto mb-4" style="max-width: 480px;">The product or page you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4 py-2"><i class="fa-solid fa-house me-2"></i> Back to Homepage</a>
      <a href="{{ url_for('catalog') }}" class="btn btn-outline-secondary rounded-pill px-4 py-2"><i class="fa-solid fa-grid-2 me-2"></i> Browse Catalog</a>
    </div>
  </div>
</div>
{% endblock %}
