{% extends 'base.html' %}
{% block title %}500 - Server Error | VoltCart{% endblock %}
{% block content %}
<div class="container text-center py-5">
  <div class="py-5">
    <div class="display-1 fw-bold text-danger mb-3"><i class="fa-solid fa-server"></i> 500</div>
    <h2 class="fw-bold mb-3">Internal Server Error</h2>
    <p class="text-muted mx-auto mb-4" style="max-width: 480px;">Something went wrong on our end. Our engineering team has been notified. Please try again shortly.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4 py-2"><i class="fa-solid fa-house me-2"></i> Return Home</a>
  </div>
</div>
{% endblock %}
